name: Publish viewer guide

on:
  push:
    branches: [gh-pages]
    paths:
      - 'docs/**'
      - 'scripts/build-guide.py'
      - 'scripts/guide-layout.html'
      - 'scripts/guide-rooms.html'
      - 'scripts/verify-guide.py'
      - 'scripts/guide-coverage.json'
      - 'scripts/import-guide-resources.py'
      - 'scripts/audit-guide-coverage.py'
      - '.github/workflows/guide-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Generate guide
        run: python3 scripts/build-guide.py
      - name: Verify guide
        run: python3 scripts/verify-guide.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public guide
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy guide
        id: deployment
        uses: actions/deploy-pages@v4
